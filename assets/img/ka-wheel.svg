<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="twR" cx="50%" cy="50%" r="50%"><stop offset="65%" stop-color="#1A1C1E"/><stop offset="85%" stop-color="#282B30"/><stop offset="100%" stop-color="#0E0F11"/></radialGradient>
    <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0F4F8"/><stop offset="50%" stop-color="#A5ACB5"/><stop offset="100%" stop-color="#606770"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="#121416"/>
  <g transform="translate(300, 300)">
    <!-- 165/70 R13 Tire -->
    <circle cx="0" cy="0" r="260" fill="url(#twR)" stroke="#090A0C" stroke-width="6"/>
    <!-- Tread blocks -->
    <circle cx="0" cy="0" r="248" fill="none" stroke="#22252A" stroke-width="8" stroke-dasharray="14 10"/>
    <text x="0" y="-215" font-family="'Zen Kaku Gothic New', sans-serif" font-size="11" fill="#4B535C" text-anchor="middle" letter-spacing="3">PIRELLI P400 · 165/70 R13 79T</text>
    
    <!-- 13-inch Steel Wheel Rim with Silver Ka Hubcap -->
    <circle cx="0" cy="0" r="190" fill="url(#rimG)" stroke="#3E444B" stroke-width="4"/>
    <circle cx="0" cy="0" r="150" fill="#202327"/>
    <circle cx="0" cy="0" r="142" fill="#7E8792"/>
    
    <!-- Iconic 8 Ventilation Circles -->
    <circle cx="0" cy="-90" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="64" cy="-64" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="90" cy="0" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="64" cy="64" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="90" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="-64" cy="64" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="-90" cy="0" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>
    <circle cx="-64" cy="-64" r="20" fill="#181A1D" stroke="#333" stroke-width="2"/>

    <!-- Center Hub with Ford Blue Oval -->
    <circle cx="0" cy="0" r="54" fill="#DCE1E6" stroke="#909AA4" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="36" ry="20" fill="#003478" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="0" y="7" font-family="'Zen Kaku Gothic New', sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle" font-style="italic">Ford</text>
  </g>
</svg>