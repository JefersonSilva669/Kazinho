<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <linearGradient id="dashG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34383F"/><stop offset="50%" stop-color="#24272C"/><stop offset="100%" stop-color="#151719"/></linearGradient>
    <linearGradient id="seatG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A525D"/><stop offset="100%" stop-color="#22252A"/></linearGradient>
    <radialGradient id="clockFace" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="85%" stop-color="#E4E8EC"/><stop offset="100%" stop-color="#B8C0C8"/></radialGradient>
  </defs>
  <!-- Background Cabin & Windshield View -->
  <rect width="1000" height="640" fill="#111315"/>
  <path d="M 80 120 Q 500 40 920 120 L 880 340 Q 500 300 120 340 Z" fill="#202A33" opacity="0.6"/>
  <!-- Street horizon through windshield -->
  <line x1="80" y1="260" x2="920" y2="260" stroke="#FF5544" stroke-width="1" opacity="0.3"/>

  <!-- Asymmetric Sweeping New Edge Dashboard -->
  <path d="M 0 320 Q 300 240 500 250 Q 750 260 1000 350 L 1000 640 L 0 640 Z" fill="url(#dashG)" stroke="#111" stroke-width="2"/>
  
  <!-- Instrument Binnacle (Cluster Arc in front of Driver) -->
  <path d="M 120 310 C 130 220, 320 220, 370 310 Z" fill="#1C1E22" stroke="#444A52" stroke-width="2"/>
  <!-- White-dial Speedometer -->
  <circle cx="245" cy="285" r="40" fill="#0E1012" stroke="#5E6772" stroke-width="2"/>
  <circle cx="245" cy="285" r="36" fill="#181B1F"/>
  <text x="245" y="275" font-family="'Zen Kaku Gothic New', sans-serif" font-size="10" fill="#FFF" text-anchor="middle">120</text>
  <text x="245" y="295" font-family="'Zen Kaku Gothic New', sans-serif" font-size="7" fill="#88929D" text-anchor="middle">km/h</text>
  <!-- Speedo needle in orange -->
  <line x1="245" y1="285" x2="265" y2="265" stroke="#FF5522" stroke-width="2.5" stroke-linecap="round"/>

  <!-- THE ICONIC OVAL ANALOG DASHBOARD CLOCK -->
  <!-- Positioned right at center top of fascia (Hotspot target 1) -->
  <g transform="translate(500, 260)">
    <ellipse cx="0" cy="0" rx="42" ry="26" fill="#141618" stroke="#555E68" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="36" ry="21" fill="url(#clockFace)"/>
    <!-- Hour tick marks -->
    <line x1="0" y1="-17" x2="0" y2="-12" stroke="#111" stroke-width="2"/>
    <line x1="0" y1="17" x2="0" y2="12" stroke="#111" stroke-width="2"/>
    <line x1="-28" y1="0" x2="-22" y2="0" stroke="#111" stroke-width="2"/>
    <line x1="28" y1="0" x2="22" y2="0" stroke="#111" stroke-width="2"/>
    <!-- Ford Ka Script & Clock Hands -->
    <ellipse cx="0" cy="7" rx="8" ry="4" fill="#003478"/>
    <line x1="0" y1="0" x2="14" y2="-6" stroke="#1A1C1F" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8" y2="-10" stroke="#1A1C1F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#D41424"/>
  </g>

  <!-- Spherical 360° Eyeball Air Vents (Hotspot target 2) -->
  <g transform="translate(410, 310)">
    <circle cx="0" cy="0" r="26" fill="#16181B" stroke="#484E56" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#24282E"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#5A626C" stroke-width="3"/>
  </g>
  <g transform="translate(590, 310)">
    <circle cx="0" cy="0" r="26" fill="#16181B" stroke="#484E56" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#24282E"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#5A626C" stroke-width="3"/>
  </g>

  <!-- 3-Spoke Sports Steering Wheel (Hotspot target 4) -->
  <g transform="translate(245, 460)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#181B1E" stroke-width="26"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#2C3036" stroke-width="18"/>
    <!-- Center Hub -->
    <ellipse cx="0" cy="0" rx="48" ry="38" fill="#202327" stroke="#3D434B" stroke-width="3"/>
    <!-- Ford Blue Oval Emblem -->
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="#003478" stroke="#C0C8D0" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Zen Kaku Gothic New', sans-serif" font-size="10" font-weight="bold" fill="#FFF" text-anchor="middle" font-style="italic">Ford</text>
    <!-- 3 Spokes -->
    <line x1="-40" y1="10" x2="-130" y2="30" stroke="#24272C" stroke-width="20" stroke-linecap="round"/>
    <line x1="40" y1="10" x2="130" y2="30" stroke="#24272C" stroke-width="20" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="0" y2="130" stroke="#24272C" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Center Console & 5-Speed Shift Lever (Hotspot target 5) -->
  <g transform="translate(500, 500)">
    <!-- Console Base Curve -->
    <path d="M -50 0 L 50 0 L 80 140 L -80 140 Z" fill="#1A1C1F" stroke="#2E333A" stroke-width="2"/>
    <!-- Leather Shift Gaiter -->
    <ellipse cx="0" cy="50" rx="36" ry="22" fill="#25292E" stroke="#3E444D" stroke-width="2"/>
    <line x1="0" y1="50" x2="0" y2="-20" stroke="#88929D" stroke-width="8" stroke-linecap="round"/>
    <!-- Gear Knob with 5-Speed Gate Map -->
    <circle cx="0" cy="-28" r="18" fill="#181B1E" stroke="#484F57" stroke-width="2"/>
    <text x="0" y="-24" font-family="'Zen Kaku Gothic New', sans-serif" font-size="8" fill="#E8EDF2" text-anchor="middle" font-weight="bold">1 3 5 / 2 4 R</text>
  </g>
</svg>